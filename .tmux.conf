## Options ###

set -g default-terminal "screen-256color" # 256色ターミナル
set -s escape-time      0                 # ESCの遅延をなくす
set -g bell-action      none              # ベル無効
set -g base-index       1                 # window番号基準値
set -g message-style    fg=white,bg=red,bold # メッセージのスタイル
set -g status-style     bg=colour234
#set -g default-shell   /bin/bash         # bashをデフォルトshellにする
#set -g default-command /bin/bash
set -g update-environment -r

## Window Options ###

setw -g mode-keys vi
setw -g automatic-rename on
setw -g monitor-activity on
set -g mouse off # マウスモードはデフォルトはoff

## KeyBind ###

# Windowタイトル変更 C-w
bind C-w command-prompt "rename-window %%"

# セッション名変更 C-s
bind C-s command-prompt "rename-session %%"

# セッション一覧を表示
bind C-a list-session

# Ctrl-tをprefixキーに設定する
set -g prefix C-t
unbind-key C-b
bind-key C-t send-prefix

# Ctrl-Cを無効化
unbind C-c

# 設定ファイル再読み込み
unbind r
bind C-r source-file ~/.tmux.conf \; display-message "Reloaded Config!!"

# マウスモードのオンオフを切り替える
bind m set -g mouse on \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'

# C-t連打で直前のwindowと切り替え
unbind C-t
bind-key C-t last-window

# 画面分割
unbind v
bind-key v split-window -v
unbind =
bind-key = split-window -h

# windowの移動
bind c new-window
bind p previous-window
bind n next-window
bind t last-window

bind C-k kill-pane
bind y copy-mode
bind P paste-buffer

# ペインの移動にvi風キーバインドが使えるようにする
unbind j
unbind k
unbind h
unbind l
bind -r j select-pane -D
bind -r k select-pane -U
bind -r h select-pane -L
bind -r l select-pane -R

# ペインのサイズを変更する時にvi風キーバインドが使えるようにする
unbind J
unbind K
unbind H
unbind L
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

